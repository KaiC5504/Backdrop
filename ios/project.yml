name: Backdrop

options:
  bundleIdPrefix: com.kaichuan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# No `configFiles:` — a project-level xcconfig comes out of XcodeGen as a file reference
# with no parent group, and Codemagic's signing step dies reading it. The team is written
# in by `xcode-project use-profiles`; the build number comes from the command line.

packages:
  BackdropCore:
    path: ../core

settings:
  base:
    # Swift 5 language mode on purpose: strict concurrency turns first bring-up into a
    # wall of actor-isolation errors that cannot be iterated on without a Mac.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # A default only. CI overrides this per build from the command line; App Store
    # Connect rejects a build number it has already seen.
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  Backdrop:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
    dependencies:
      - package: BackdropCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kaichuan.backdrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Backdrop-Info.plist
      properties:
        CFBundleDisplayName: Backdrop
        # XcodeGen's defaults are the literals "1.0" and "1"; referencing the build
        # settings is what lets CI vary the build number.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        # Nothing leaves the device; without this every upload sits in TestFlight as
        # "Missing Compliance".
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Upload validation demands all four for iPad regardless of device family.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSPhotoLibraryUsageDescription: >-
          Backdrop reads your Photos library to list and play your videos. Nothing
          leaves your phone.

# Declared so `xcodebuild -scheme Backdrop` works without Xcode ever having opened the
# project to autocreate one.
schemes:
  Backdrop:
    build:
      targets:
        Backdrop: all
    run:
      config: Debug
    archive:
      config: Release
